<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Ledger</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/app.css?v=buttons-2" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>
<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>Team Ledger — <span id="teamName"></span></h4>
    <a href="#" id="backLink" class="btn btn-outline-secondary btn-sm">← Back to Teams</a>
  </div>
  <table class="table table-hover bg-white shadow-sm">
    <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Balance Before</th><th>Balance After</th><th>Reason</th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="text-center text-muted">Loading...</td></tr></tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=status-colors-1"></script>
<script src="js/nav.js?v=users-access-1"></script>
<script src="js/ui.js?v=notices-2"></script>
<script>
if (!requireAuth(['SuperAdmin', 'AuctionAdmin'])) { throw new Error('unauth'); }
renderNavbar('teams.html');
const params = new URLSearchParams(location.search);
const teamId = params.get('teamId');
const auctionId = params.get('auctionId');
document.getElementById('backLink').href = auctionId ? `teams.html?auctionId=${auctionId}` : 'admin-dashboard.html';

async function load() {
  const entries = await Api.get(`/api/teams/${teamId}/ledger`);
  document.getElementById('teamName').textContent = `Team #${teamId}`;
  document.getElementById('rows').innerHTML = entries.map(e => `
    <tr>
      <td>${new Date(e.createdAt).toLocaleString()}</td>
      <td>${e.transactionType}</td>
      <td class="${e.amount < 0 ? 'balance-low' : 'balance-positive'}">${fmtMoney(e.amount)}</td>
      <td>${fmtMoney(e.balanceBefore)}</td>
      <td>${fmtMoney(e.balanceAfter)}</td>
      <td>${e.reason || ''}</td>
    </tr>`).join('') || '<tr><td colspan="6" class="text-center text-muted">No ledger entries</td></tr>';
}
load().catch(err => alert(err.message));
</script>
</body>
</html>
