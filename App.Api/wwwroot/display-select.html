<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Auctions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/app.css?v=notices-2" rel="stylesheet">
</head>
<body>
<div class="container py-5">
  <h3 class="mb-4">Public Auctions</h3>
  <div id="rows" class="row g-3"></div>
  <p class="mt-4"><a href="login.html">← Back to login</a></p>
</div>
<script src="js/api.js?v=status-colors-1"></script>
<script src="js/ui.js?v=notices-2"></script>
<script>
async function load() {
  const auctions = await Api.get('/api/auctions');
  const publicAuctions = auctions.filter(a => a.visibility === 'PublicViewOnly');
  document.getElementById('rows').innerHTML = publicAuctions.map(a => `
    <div class="col-md-4">
      <div class="card p-3">
        <h5>${a.name}</h5>
        <p class="text-muted mb-1">${a.sportType} · <span class="badge ${statusBadgeClass(a.status)}">${humanizeStatus(a.status)}</span></p>
        <a class="btn btn-primary btn-sm" href="display.html?auctionId=${a.id}">View Live Display</a>
      </div>
    </div>`).join('') || '<p class="text-muted">No public auctions available right now.</p>';
}
load().catch(err => showUiNotice(err.message, 'error'));
</script>
</body>
</html>
