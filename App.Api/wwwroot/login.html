<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Auction Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/app.css?v=buttons-2" rel="stylesheet">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h3 class="mb-3 text-center">🏆 Auction Platform</h3>
          <form id="loginForm" autocomplete="off">
            <div class="mb-3">
              <label class="form-label">Email or username</label>
              <input type="text" class="form-control" id="email" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <div class="input-group"><input type="password" class="form-control" id="password" autocomplete="current-password" required><button class="btn btn-outline-secondary" type="button" aria-label="Show password" onclick="togglePasswordVisibility('password', this)">Show</button></div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Log in</button>
          </form>
          <p class="text-center mt-3 mb-0"><a href="display-select.html">View public auctions without logging in →</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="js/api.js?v=status-colors-1"></script>
<script src="js/ui.js?v=notices-2"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  clearUiNotices();
  try {
    const data = await Api.post('/api/auth/login', { email, password });
    Api.setSession(data);
    if (data.role === 'TeamOwner') location.href = 'team-dashboard.html';
    else location.href = 'admin-dashboard.html';
  } catch (err) {
    showUiNotice(err.message || 'Login failed', 'error');
  }
});
</script>
</body>
</html>
