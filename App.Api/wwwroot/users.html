<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users & Access - Player Auction</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/app.css?v=user-access-2" rel="stylesheet">
</head>
<body>
<div id="app-navbar"></div>
<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3"><div><h3 class="mb-1">Users & Auction Access</h3><p class="text-muted mb-0">You are the SuperAdmin. Other administrators only see the auctions checked here.</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#userModal">+ Add User</button></div>
  <div id="userList" class="row g-3"></div>
</main>
<div class="modal fade" id="userModal" tabindex="-1"><div class="modal-dialog"><div class="modal-content"><form id="userForm" autocomplete="off">
  <div class="modal-header"><h5 class="modal-title">Add Auction Administrator</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body">
    <div class="mb-3"><label class="form-label">Name</label><input id="displayName" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Email or username</label><input id="email" type="text" class="form-control" autocomplete="off" autocapitalize="none" spellcheck="false" required><div class="form-text">They will use this to sign in.</div></div>
    <div class="mb-3"><label class="form-label">Initial password</label><div class="input-group"><input id="password" type="password" class="form-control" autocomplete="new-password" minlength="12" required><button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', this)">Show</button></div><div class="form-text">Give this password to the user. They can change it from Account after signing in.</div></div>
    <label class="form-label">Allowed auctions</label><div id="newAuctionChoices"></div>
  </div>
  <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" type="submit">Create User</button></div>
</form></div></div></div>
<script src="js/api.js?v=status-colors-1"></script><script src="js/nav.js?v=users-access-1"></script><script src="js/ui.js?v=notices-2"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
if (!requireAuth(['SuperAdmin'])) throw new Error('unauth');
renderNavbar('users.html');
let auctions = [], users = [];
const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
const choices = (ids, prefix) => auctions.map(a => `<label class="d-block mb-2"><input class="form-check-input me-2 auction-choice" data-prefix="${prefix}" type="checkbox" value="${a.id}" ${ids.includes(a.id) ? 'checked' : ''}>${escapeHtml(a.name)}</label>`).join('') || '<span class="text-muted">No auctions available</span>';
const selected = prefix => [...document.querySelectorAll(`.auction-choice[data-prefix="${prefix}"]:checked`)].map(x => Number(x.value));
async function load() {
  [auctions, users] = await Promise.all([Api.get('/api/auctions'), Api.get('/api/users')]);
  document.getElementById('newAuctionChoices').innerHTML = choices([], 'new');
  document.getElementById('userList').innerHTML = users.map(u => `
    <div class="col-lg-6"><div class="card shadow-sm h-100"><div class="card-body">
      <div class="d-flex justify-content-between align-items-start gap-3">
        <div class="min-width-0"><h5 class="mb-0">${escapeHtml(u.displayName)}</h5><span class="text-muted text-break">${escapeHtml(u.email)}</span></div>
        <span class="badge bg-secondary flex-shrink-0 align-self-start">Auction Admin</span>
      </div>
      <hr><label class="form-label fw-semibold">Auction access</label><div id="access-${u.id}">${choices(u.auctionIds, String(u.id))}</div>
      <button class="btn btn-primary btn-sm mt-3" onclick="saveAccess(${u.id})">Save Access</button>
      <hr><label class="form-label fw-semibold" for="new-password-${u.id}">Set a new password</label>
      <div class="input-group">
        <input class="form-control" id="new-password-${u.id}" type="password" minlength="12" autocomplete="new-password" placeholder="Enter new password">
        <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('new-password-${u.id}', this)">Show</button>
        <button class="btn btn-primary" type="button" onclick="resetPassword(${u.id})">Set Password</button>
      </div>
      <div class="form-text">At least 12 characters with uppercase, lowercase, a number, and a symbol.</div>
    </div></div></div>`).join('') || '<p class="text-muted">No additional users yet.</p>';
}
async function saveAccess(id) { try { await Api.put(`/api/users/${id}/auctions`, { auctionIds: selected(String(id)) }); showUiNotice('Auction access updated', 'success'); } catch(e) { showUiNotice(e.message, 'error'); } }
async function resetPassword(id) {
  const input = document.getElementById(`new-password-${id}`);
  const newPassword = input.value;
  if (!newPassword) { showUiNotice('Enter the new password first.', 'warning'); input.focus(); return; }
  try {
    await Api.put(`/api/users/${id}/password`, { newPassword });
    input.value = '';
    input.type = 'password';
    showUiNotice('Password updated', 'success');
  } catch(e) { showUiNotice(e.message, 'error'); }
}
document.getElementById('userForm').addEventListener('submit', async e => { e.preventDefault(); try { await Api.post('/api/users', { displayName: document.getElementById('displayName').value, email: document.getElementById('email').value, password: document.getElementById('password').value, auctionIds: selected('new') }); bootstrap.Modal.getInstance(document.getElementById('userModal')).hide(); e.target.reset(); await load(); showUiNotice('User created', 'success'); } catch(err) { showUiNotice(err.message, 'error'); } });
load().catch(e => showUiNotice(e.message, 'error'));
</script>
</body></html>
