<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Team</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/app.css?v=buttons-2" rel="stylesheet">
</head>
<body>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>My Team Dashboard</h4>
    <button class="btn btn-outline-secondary btn-sm" onclick="logout()">Logout</button>
  </div>

  <div id="noTeam" class="alert alert-info d-none">No team is currently assigned to your account.</div>

  <div id="dashboard" class="d-none">
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <div class="text-muted small">Team</div>
          <div class="fs-4 fw-bold" id="teamName"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <div class="text-muted small">Available Balance</div>
          <div class="fs-4 fw-bold balance-positive" id="teamBalance"></div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card p-3 text-center">
          <div class="text-muted small">Roster Size</div>
          <div class="fs-4 fw-bold" id="rosterCount"></div>
        </div>
      </div>
    </div>

    <div class="card p-3 mb-3" id="liveCard">
      <h6>Current Live Player</h6>
      <div id="currentPlayer" class="text-muted">No player currently up for bidding.</div>
      <div class="input-group mt-2" id="bidControls" style="display:none;">
        <input type="number" class="form-control" id="bidAmount" placeholder="Your bid amount">
        <button class="btn btn-primary" onclick="placeBid()">Place Bid</button>
      </div>
      <div id="bidMsg" class="mt-2 small"></div>
    </div>

    <div class="card p-3">
      <h6>My Roster</h6>
      <table class="table table-sm">
        <thead><tr><th>Name</th><th>Role</th><th>Sale Price</th></tr></thead>
        <tbody id="roster"></tbody>
      </table>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=status-colors-1"></script>
<script src="js/signalr-helper.js?v=numeric-auction-id-1"></script>
<script src="js/ui.js?v=notices-2"></script>
<script>
if (!requireAuth(['TeamOwner'])) { throw new Error('unauth'); }

let myTeam = null;
let auctionId = null;
let currentPlayer = null;
let connection = null;

async function findMyTeam() {
  const auctions = await Api.get('/api/auctions');
  for (const a of auctions) {
    try {
      const teams = await Api.get(`/api/auctions/${a.id}/teams`);
      const mine = teams.find(t => t.ownerUserId === Api.currentUserId());
      if (mine) return { auction: a, team: mine };
    } catch (e) {}
  }
  return null;
}

async function refreshTeam() {
  const teams = await Api.get(`/api/auctions/${auctionId}/teams`);
  myTeam = teams.find(t => t.id === myTeam.id) || myTeam;
  document.getElementById('teamBalance').textContent = fmtMoney(myTeam.availableBalance);
  document.getElementById('rosterCount').textContent = myTeam.rosterCount;

  const players = await Api.get(`/api/auctions/${auctionId}/players`);
  const mine = players.filter(p => p.teamId === myTeam.id && (p.status === 'Sold' || p.isCaptain));
  document.getElementById('roster').innerHTML = mine.map(p => `
    <tr><td>${p.name}${p.isCaptain ? ' <span class="badge bg-info text-dark">Captain</span>' : ''}</td><td>${p.role}</td><td>${p.isCaptain && !(p.captainCost > 0) ? '' : fmtMoney(p.isCaptain ? p.captainCost : p.salePrice)}</td></tr>`).join('')
    || '<tr><td colspan="3" class="text-muted">No players yet</td></tr>';
}

async function refreshLive() {
  const state = await Api.get(`/api/auctions/${auctionId}/state`);
  currentPlayer = state.currentPlayer;
  const el = document.getElementById('currentPlayer');
  const controls = document.getElementById('bidControls');
  if (!currentPlayer) {
    el.innerHTML = '<span class="text-muted">No player currently up for bidding.</span>';
    controls.style.display = 'none';
    return;
  }
  const highest = (state.recentBids || []).filter(b => b.isValid).sort((a,b) => b.amount - a.amount)[0];
  el.innerHTML = `<h5>${currentPlayer.name}</h5><p class="mb-1">${currentPlayer.role} · Base: ${fmtMoney(currentPlayer.basePrice)}</p>
    <p>Current highest bid: <strong>${highest ? fmtMoney(highest.amount) : '(none yet)'}</strong></p>`;
  controls.style.display = state.auction.status === 'Live' || state.auction.status === 'UnsoldPoolOpen' ? 'flex' : 'none';
}

async function placeBid() {
  const amount = parseFloat(document.getElementById('bidAmount').value);
  if (!currentPlayer || !amount) {
    showUiNotice('Enter a valid bid amount.', 'warning');
    return;
  }
  try {
    await Api.post(`/api/auctions/${auctionId}/bids`, { playerId: currentPlayer.id, teamId: myTeam.id, amount });
    document.getElementById('bidMsg').textContent = '';
    showUiNotice('Bid placed!', 'success');
    document.getElementById('bidAmount').value = '';
  } catch (err) {
    document.getElementById('bidMsg').textContent = '';
    showUiNotice(err.message, 'error');
  }
}

function logout() { Api.clearSession(); location.href = 'login.html'; }

async function init() {
  const found = await findMyTeam();
  if (!found) {
    document.getElementById('noTeam').classList.remove('d-none');
    return;
  }
  myTeam = found.team;
  auctionId = found.auction.id;
  document.getElementById('teamName').textContent = myTeam.name;
  document.getElementById('dashboard').classList.remove('d-none');

  await refreshTeam();
  await refreshLive();

  connection = createAuctionConnection(auctionId, {
    player_selected: refreshLive,
    bid_placed: refreshLive,
    bid_rejected: refreshLive,
    player_sold: () => { refreshLive(); refreshTeam(); },
    player_unsold: refreshLive,
    balance_updated: refreshTeam,
    auction_status_changed: refreshLive,
  }, () => { refreshLive(); refreshTeam(); });
}
init().catch(err => alert(err.message));
</script>
</body>
</html>
