app = "CHANGE-ME-app-auction"
primary_region = "iad"

[build]

[env]
  ASPNETCORE_URLS = "http://+:8080"

[[mounts]]
  source = "app_data"
  destination = "/app/App_Data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
